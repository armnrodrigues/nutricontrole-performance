name = "nutricontrole"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# Banco com todos os registros (um documento JSON por caminho, como no artefato)
[[d1_databases]]
binding = "DB"
database_name = "nutricontrole"
database_id = "a562dce0-750a-498f-b6c9-25672d65d1a4"

# Fotos e vídeos dos exercícios (até 20 MB cada)
[[kv_namespaces]]
binding = "MEDIA"
id = "34bc7d26b7c141fb9b1b41d5ad9b01d1"

[vars]
# Equipe do Cloudflare Access, por exemplo "minhaequipe.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "round-union-441e.cloudflareaccess.com"
# Application Audience (AUD) do aplicativo criado no Access
ACCESS_AUD = "1579828d7228748446c46b4c4f8624f9ed26d3f32ce2b5ec94b6c208d589d8cc"
